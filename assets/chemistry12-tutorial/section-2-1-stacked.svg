<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">2.1: Dynamic equilibrium: changes continue; Forward rate = reverse rate</title><desc id="desc">Opposing A to B and B to A arrows inside a closed boundary. Forward and reverse rate curves converge to the same nonzero rate.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§2.1 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Dynamic equilibrium: changes continue</text><text x="38" y="553" font-size="18" font-weight="700">Forward rate = reverse rate</text>
<g transform="translate(35 108)"><rect x="15" y="40" width="410" height="190" rx="9" fill="#fff" stroke="#dce2d9" stroke-width="2"/><text x="90" y="95" font-size="34" fill="#213e36" text-anchor="middle">A</text><text x="350" y="95" font-size="34" fill="#213e36" text-anchor="middle">B</text><path d="M140,85L288.0,85.0" fill="none" stroke="#235b47" stroke-width="3"/><polygon points="300,85 288.0,91.0 288.0,79.0" fill="#235b47"/><path d="M300,140L152.0,140.0" fill="none" stroke="#b54f2c" stroke-width="3"/><polygon points="140,140 152.0,134.0 152.0,146.0" fill="#b54f2c"/><text x="220" y="190" font-size="22" fill="#213e36" text-anchor="middle">Equal opposing rates</text><text x="20" y="280" font-size="20" fill="#213e36" text-anchor="start">Closed system; constant conditions.</text><text x="20" y="309" font-size="20" fill="#213e36" text-anchor="start">Molecular changes continue.</text></g><g transform="translate(35 573)"><path d="M45,265L403.0,265.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="415,265 403.0,271.0 403.0,259.0" fill="#213e36"/><path d="M45,265L45.0,47.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="45,35 51.0,47.0 39.0,47.0" fill="#213e36"/><text x="48" y="22" font-size="18" fill="#213e36" text-anchor="start">Reaction rate</text><text x="415" y="295" font-size="18" fill="#213e36" text-anchor="end">Time</text><path d="M45 60 C110 95 135 160 260 160 H410" fill="none" stroke="#235b47" stroke-width="4"/><path d="M45 255 C110 210 160 160 260 160 H410" fill="none" stroke="#b54f2c" stroke-width="4"/><path d="M260,35L260,265" fill="none" stroke="#213e36" stroke-width="2" stroke-dasharray="6 5"/><text x="60" y="52" font-size="18" fill="#235b47" text-anchor="start">Forward</text><text x="65" y="235" font-size="18" fill="#b54f2c" text-anchor="start">Reverse</text><text x="277" y="195" font-size="17" fill="#213e36" text-anchor="start">Equal, nonzero</text><text x="40" y="332" font-size="18" fill="#213e36" text-anchor="start">Equal rates; concentrations need not match.</text></g></g></svg>