<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">4.3: Water produces both kinds of ion; At fixed temperature, Kw is constant</title><desc id="desc">Autoionization of two waters gives hydronium and hydroxide. Both are 10 to the minus 7 M in neutral pure water at 25 degrees C; increasing one lowers the other at fixed Kw.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§4.3 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Water produces both kinds of ion</text><text x="528" y="88" font-size="18" font-weight="700">At fixed temperature, Kw is constant</text>
<g transform="translate(35 108)"><text x="20" y="55" font-size="29" fill="#213e36" text-anchor="start" font-weight="700">2H₂O ⇌ H₃O⁺ + OH⁻</text><circle cx="110" cy="150" r="40" fill="#fbe0d4" stroke="#b54f2c" stroke-width="2"/><text x="110" y="156" font-size="17" fill="#b54f2c" text-anchor="middle" font-weight="700">H₃O⁺</text><circle cx="330" cy="150" r="40" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="330" y="156" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">OH⁻</text><text x="110" y="228" font-size="25" fill="#213e36" text-anchor="middle">10⁻⁷ M</text><text x="330" y="228" font-size="25" fill="#213e36" text-anchor="middle">10⁻⁷ M</text><text x="20" y="300" font-size="19" fill="#213e36" text-anchor="start">Neutral pure water at 25 °C.</text><text x="20" y="329" font-size="19" fill="#213e36" text-anchor="start">Ion concentrations are equal, not zero.</text></g><g transform="translate(525 108)"><text x="20" y="55" font-size="29" fill="#213e36" text-anchor="start" font-weight="700">Kw = [H₃O⁺][OH⁻]</text><text x="20" y="105" font-size="25" fill="#213e36" text-anchor="start">= 1.0 × 10⁻¹⁴ at 25 °C</text><path d="M70,230L70.0,172.0" fill="none" stroke="#b54f2c" stroke-width="3"/><polygon points="70,160 76.0,172.0 64.0,172.0" fill="#b54f2c"/><path d="M300,160L300.0,218.0" fill="none" stroke="#315c88" stroke-width="3"/><polygon points="300,230 294.0,218.0 306.0,218.0" fill="#315c88"/><text x="70" y="275" font-size="22" fill="#b54f2c" text-anchor="middle">[H₃O⁺] ↑</text><text x="300" y="275" font-size="22" fill="#315c88" text-anchor="middle">[OH⁻] ↓</text><text x="20" y="335" font-size="21" fill="#213e36" text-anchor="start">Fixed temperature → fixed product.</text></g></g></svg>