<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">6.5: Electrolysis: electrical energy drives change; Use electron stoichiometry and charge</title><desc id="desc">A DC supply connects positive anode and negative cathode in molten sodium chloride. Chloride is oxidized to chlorine and sodium ions are reduced to sodium. Charge equals current times time and electron moles equal charge over Faraday constant.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§6.5 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Electrolysis: electrical energy drives change</text><text x="38" y="553" font-size="18" font-weight="700">Use electron stoichiometry and charge</text>
<g transform="translate(35 108)"><rect x="125" y="30" width="190" height="65" rx="9" fill="#fff" stroke="#b54f2c" stroke-width="2"/><text x="220" y="72" font-size="24" fill="#213e36" text-anchor="middle">DC supply</text><text x="143" y="120" font-size="26" fill="#b54f2c" text-anchor="start">+</text><text x="290" y="120" font-size="26" fill="#315c88" text-anchor="start">−</text><path d="M145,95L80,145" fill="none" stroke="#213e36" stroke-width="3"/><path d="M295,95L355,145" fill="none" stroke="#213e36" stroke-width="3"/><path d="M25,165v155h390v-155" fill="none" stroke="#213e36" stroke-width="3"/><rect x="29" y="200" width="382" height="116" rx="9" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="2"/><rect x="70" y="140" width="20" height="140" rx="9" fill="#ddd" stroke="#213e36" stroke-width="2"/><rect x="345" y="140" width="20" height="140" rx="9" fill="#ddd" stroke="#213e36" stroke-width="2"/><text x="105" y="350" font-size="22" fill="#213e36" text-anchor="middle">Anode (+)</text><text x="330" y="350" font-size="22" fill="#213e36" text-anchor="middle">Cathode (−)</text><path d="M220,220L308.0,220.0" fill="none" stroke="#315c88" stroke-width="3"/><polygon points="320,220 308.0,226.0 308.0,214.0" fill="#315c88"/><text x="220" y="260" font-size="20" fill="#315c88" text-anchor="middle">Na⁺</text></g><g transform="translate(35 573)"><text x="20" y="40" font-size="22" fill="#213e36" text-anchor="start" font-weight="700">Molten NaCl (no water present)</text><text x="20" y="95" font-size="23" fill="#213e36" text-anchor="start">Anode: 2Cl⁻ → Cl₂ + 2e⁻</text><text x="20" y="145" font-size="23" fill="#213e36" text-anchor="start">Cathode: 2Na⁺ + 2e⁻ → 2Na</text><rect x="20" y="200" width="395" height="65" rx="9" fill="#eef2e9" stroke="#dce2d9" stroke-width="2"/><text x="215" y="241" font-size="25" fill="#213e36" text-anchor="middle">Q = It;  mol e⁻ = Q/F</text><text x="20" y="310" font-size="19" fill="#213e36" text-anchor="start">In water, water can also react.</text><text x="20" y="339" font-size="19" fill="#213e36" text-anchor="start">Available species determine the products.</text></g></g></svg>