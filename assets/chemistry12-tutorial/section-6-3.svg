<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">6.3: Compare standard reduction potentials; Subtract the two tabulated reductions</title><desc id="desc">Copper reduction at plus 0.34 volts is compared with zinc reduction at minus 0.76 volts. Copper-ion reduction with zinc oxidation gives standard cell potential plus 1.10 volts.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§6.3 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Compare standard reduction potentials</text><text x="528" y="88" font-size="18" font-weight="700">Subtract the two tabulated reductions</text>
<g transform="translate(35 108)"><text x="20" y="40" font-size="25" fill="#213e36" text-anchor="start" font-weight="700">Table entries are reductions</text><rect x="15" y="75" width="410" height="75" rx="9" fill="#eef2e9" stroke="#dce2d9" stroke-width="2"/><text x="30" y="108" font-size="24" fill="#213e36" text-anchor="start">Cu²⁺ + 2e⁻ → Cu</text><text x="400" y="137" font-size="22" fill="#213e36" text-anchor="end">+0.34 V</text><rect x="15" y="175" width="410" height="75" rx="9" fill="#eef2e9" stroke="#dce2d9" stroke-width="2"/><text x="30" y="208" font-size="24" fill="#213e36" text-anchor="start">Zn²⁺ + 2e⁻ → Zn</text><text x="400" y="237" font-size="22" fill="#213e36" text-anchor="end">−0.76 V</text><text x="20" y="330" font-size="18" fill="#213e36" text-anchor="start">More positive → greater reduction tendency.</text></g><g transform="translate(525 108)"><text x="20" y="50" font-size="23" fill="#213e36" text-anchor="start">Cu²⁺ is reduced; Zn is oxidized.</text><text x="20" y="115" font-size="23" fill="#213e36" text-anchor="start">E°cell = E°cathode − E°anode</text><text x="20" y="195" font-size="25" fill="#213e36" text-anchor="start" font-weight="700">= 0.34 − (−0.76) = +1.10 V</text><text x="20" y="275" font-size="18" fill="#213e36" text-anchor="start">Positive: favourable at standard conditions.</text><text x="20" y="304" font-size="18" fill="#213e36" text-anchor="start">Do not multiply E° by a coefficient.</text></g></g></svg>