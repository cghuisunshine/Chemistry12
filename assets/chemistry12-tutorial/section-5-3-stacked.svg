<title id="title">5.3: Burette, titrant and analyte; Equivalence follows stoichiometry</title><desc id="desc">A burette of known titrant delivers drops to an analyte flask. A one-to-one HCl/NaOH reaction makes acid and base moles equal at equivalence, distinguished from the observed endpoint.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§5.3 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Burette, titrant and analyte</text><text x="38" y="553" font-size="18" font-weight="700">Equivalence follows stoichiometry</text>
<g transform="translate(35 108)"><rect x="180" y="35" width="55" height="145" rx="9" fill="#f0f6fc" stroke="#315c88" stroke-width="2"/><path d="M180,55L194,55" fill="none" stroke="#315c88" stroke-width="2"/><path d="M180,75L194,75" fill="none" stroke="#315c88" stroke-width="2"/><path d="M180,95L194,95" fill="none" stroke="#315c88" stroke-width="2"/><path d="M180,115L194,115" fill="none" stroke="#315c88" stroke-width="2"/><path d="M180,135L194,135" fill="none" stroke="#315c88" stroke-width="2"/><path d="M180,155L194,155" fill="none" stroke="#315c88" stroke-width="2"/><path d="M175,188L245,188" fill="none" stroke="#213e36" stroke-width="3"/><path d="M208,180L208,220" fill="none" stroke="#315c88" stroke-width="3"/><circle cx="208" cy="238" r="6" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="208" y="244" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700"></text><path d="M150 225V250L110 300H305L265 250V225" fill="none" stroke="#213e36" stroke-width="3"/><path d="M140,280L275,280" fill="none" stroke="#315c88" stroke-width="3"/><text x="15" y="75" font-size="23" fill="#213e36" text-anchor="start">Titrant</text><text x="15" y="110" font-size="20" fill="#213e36" text-anchor="start">Known c</text><text x="290" y="290" font-size="20" fill="#213e36" text-anchor="start">Analyte</text><text x="20" y="340" font-size="18" fill="#213e36" text-anchor="start">Delivered volume = final − initial reading.</text></g><g transform="translate(35 573)"><text x="20" y="45" font-size="22" fill="#213e36" text-anchor="start" font-weight="700">At equivalence: mole ratios match.</text><text x="20" y="105" font-size="24" fill="#213e36" text-anchor="start">HCl + NaOH → NaCl + H₂O</text><text x="20" y="175" font-size="28" fill="#213e36" text-anchor="start">1 mol : 1 mol</text><text x="20" y="235" font-size="21" fill="#213e36" text-anchor="start">c(HCl)V(HCl) = c(NaOH)V(NaOH)</text><text x="20" y="300" font-size="20" fill="#213e36" text-anchor="start">Endpoint: the observed signal.</text><text x="20" y="329" font-size="20" fill="#213e36" text-anchor="start">Choose a signal near equivalence.</text></g></g></svg>