<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">5.1: Salt: separate the ions first; A weak acid’s conjugate base hydrolyzes</title><desc id="desc">Sodium acetate dissociates into spectator sodium and acetate, which accepts a proton from water and produces hydroxide, making the solution basic.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§5.1 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Salt: separate the ions first</text><text x="38" y="553" font-size="18" font-weight="700">A weak acid’s conjugate base hydrolyzes</text>
<g transform="translate(35 108)"><text x="20" y="45" font-size="24" fill="#213e36" text-anchor="start" font-weight="700">NaCH₃COO → Na⁺ + CH₃COO⁻</text><path d="M125,90L82.3165291301963,145.4885121307448" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="75,155 77.5607851955687,141.83024756564663 87.0722730648239,149.14677669584296" fill="#213e36"/><path d="M300,90L316.47096981394975,143.5306518953366" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="320,155 310.73629576161807,145.29516698836173 322.20564386628143,141.76613680231148" fill="#213e36"/><text x="20" y="200" font-size="23" fill="#213e36" text-anchor="start">Na⁺</text><text x="20" y="235" font-size="23" fill="#213e36" text-anchor="start">Spectator</text><text x="240" y="200" font-size="21" fill="#213e36" text-anchor="start">CH₃COO⁻</text><text x="240" y="235" font-size="21" fill="#213e36" text-anchor="start">Reacts as a base</text><text x="20" y="330" font-size="20" fill="#213e36" text-anchor="start">Assess each dissolved ion separately.</text></g><g transform="translate(35 573)"><text x="15" y="55" font-size="27" fill="#213e36" text-anchor="start">CH₃COO⁻ + H₂O</text><text x="15" y="110" font-size="27" fill="#213e36" text-anchor="start">⇌ CH₃COOH + OH⁻</text><circle cx="215" cy="205" r="45" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="215" y="211" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">OH⁻</text><text x="215" y="290" font-size="26" fill="#315c88" text-anchor="middle">Basic solution</text><text x="20" y="335" font-size="20" fill="#213e36" text-anchor="start">Kb = Kw / Ka of the conjugate acid</text></g></g></svg>