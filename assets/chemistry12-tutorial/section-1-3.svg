<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">1.3: Effective collision: orientation + energy; Activation energy and activated complex</title><desc id="desc">An incoming chlorine atom approaches the bound chlorine of ClNO2. Beside it an energy barrier labels activation energy from reactants to the activated complex.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§1.3 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Effective collision: orientation + energy</text><text x="528" y="88" font-size="18" font-weight="700">Activation energy and activated complex</text>
<g transform="translate(35 108)"><text x="12" y="42" font-size="24" fill="#213e36" text-anchor="start">Cl + ClNO₂ → Cl₂ + NO₂</text><circle cx="60" cy="140" r="27" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="60" y="146" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">Cl</text><circle cx="220" cy="140" r="27" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="220" y="146" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">Cl</text><circle cx="310" cy="140" r="27" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="310" y="146" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">N</text><path d="M246,140L284,140" fill="none" stroke="#213e36" stroke-width="3"/><path d="M325,119L353,83" fill="none" stroke="#213e36" stroke-width="3"/><path d="M325,161L353,197" fill="none" stroke="#213e36" stroke-width="3"/><circle cx="370" cy="65" r="24" fill="#fbe0d4" stroke="#b54f2c" stroke-width="2"/><text x="370" y="71" font-size="17" fill="#b54f2c" text-anchor="middle" font-weight="700">O</text><circle cx="370" cy="215" r="24" fill="#fbe0d4" stroke="#b54f2c" stroke-width="2"/><text x="370" y="221" font-size="17" fill="#b54f2c" text-anchor="middle" font-weight="700">O</text><path d="M100,140L163.0,140.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="175,140 163.0,146.0 163.0,134.0" fill="#213e36"/><text x="16" y="280" font-size="19" fill="#213e36" text-anchor="start">Suitable orientation: incoming Cl faces</text><text x="16" y="309" font-size="19" fill="#213e36" text-anchor="start">the Cl end; enough energy is also needed.</text></g><g transform="translate(525 108)"><path d="M45,265L403.0,265.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="415,265 403.0,271.0 403.0,259.0" fill="#213e36"/><path d="M45,265L45.0,47.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="45,35 51.0,47.0 39.0,47.0" fill="#213e36"/><text x="48" y="22" font-size="18" fill="#213e36" text-anchor="start">Potential energy</text><text x="415" y="295" font-size="18" fill="#213e36" text-anchor="end">Reaction coordinate</text><path d="M45 210H95 C150 210 160 65 225 65 S290 235 350 235 H410" fill="none" stroke="#235b47" stroke-width="4"/><path d="M115,210L225,210" fill="none" stroke="#213e36" stroke-width="2" stroke-dasharray="6 5"/><path d="M180,207L180.0,87.0" fill="none" stroke="#b54f2c" stroke-width="3"/><polygon points="180,75 186.0,87.0 174.0,87.0" fill="#b54f2c"/><text x="190" y="148" font-size="22" fill="#b54f2c" text-anchor="start">Eₐ</text><text x="200" y="48" font-size="19" fill="#213e36" text-anchor="start">Activated complex</text><text x="55" y="332" font-size="19" fill="#213e36" text-anchor="start">Eₐ is the barrier from the reactant level.</text></g></g></svg>