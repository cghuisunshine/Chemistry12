<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">4.4: pH locates acidic, neutral and basic; A logarithmic step is a factor of ten</title><desc id="desc">A pH scale marks acidic below 7, neutral at 7 and basic above 7 at 25 degrees C. Steps from pH 3 to 4 to 5 show hydronium dropping tenfold each step.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§4.4 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">pH locates acidic, neutral and basic</text><text x="528" y="88" font-size="18" font-weight="700">A logarithmic step is a factor of ten</text>
<g transform="translate(35 108)"><path d="M30,150L410,150" fill="none" stroke="#213e36" stroke-width="4"/><path d="M30,140L30,160" fill="none" stroke="#213e36" stroke-width="3"/><text x="30" y="195" font-size="26" fill="#213e36" text-anchor="middle">0</text><path d="M220,140L220,160" fill="none" stroke="#213e36" stroke-width="3"/><text x="220" y="195" font-size="26" fill="#213e36" text-anchor="middle">7</text><path d="M410,140L410,160" fill="none" stroke="#213e36" stroke-width="3"/><text x="410" y="195" font-size="26" fill="#213e36" text-anchor="middle">14</text><text x="30" y="110" font-size="23" fill="#b54f2c" text-anchor="start">Acidic</text><text x="410" y="110" font-size="23" fill="#315c88" text-anchor="end">Basic</text><text x="220" y="245" font-size="22" fill="#235b47" text-anchor="middle">Neutral</text><text x="20" y="325" font-size="19" fill="#213e36" text-anchor="start">Familiar dilute-solution scale at 25 °C.</text></g><g transform="translate(525 108)"><text x="20" y="45" font-size="28" fill="#213e36" text-anchor="start" font-weight="700">pH = −log₁₀[H₃O⁺]</text><circle cx="70" cy="140" r="31" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="70" y="146" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">3</text><text x="70" y="220" font-size="22" fill="#213e36" text-anchor="middle">10⁻³ M</text><circle cx="215" cy="140" r="31" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="215" y="146" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">4</text><text x="215" y="220" font-size="22" fill="#213e36" text-anchor="middle">10⁻⁴ M</text><circle cx="360" cy="140" r="31" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="360" y="146" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">5</text><text x="360" y="220" font-size="22" fill="#213e36" text-anchor="middle">10⁻⁵ M</text><path d="M110,140L158.0,140.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="170,140 158.0,146.0 158.0,134.0" fill="#213e36"/><path d="M255,140L303.0,140.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="315,140 303.0,146.0 303.0,134.0" fill="#213e36"/><text x="20" y="285" font-size="19" fill="#213e36" text-anchor="start">One pH unit higher → 10× less [H₃O⁺].</text><text x="20" y="314" font-size="19" fill="#213e36" text-anchor="start">pH + pOH = 14.00 at 25 °C.</text></g></g></svg>