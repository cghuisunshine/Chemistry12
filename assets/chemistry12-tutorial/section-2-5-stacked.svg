<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">2.5: K uses equilibrium concentrations; Q tells the adjustment direction</title><desc id="desc">The ammonia equilibrium expression places squared ammonia over nitrogen times cubed hydrogen. A comparison line places Q below or above K with arrows toward equilibrium.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§2.5 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">K uses equilibrium concentrations</text><text x="38" y="553" font-size="18" font-weight="700">Q tells the adjustment direction</text>
<g transform="translate(35 108)"><text x="15" y="45" font-size="23" fill="#213e36" text-anchor="start" font-weight="700">N₂(g) + 3H₂(g) ⇌ 2NH₃(g)</text><text x="215" y="125" font-size="29" fill="#213e36" text-anchor="middle">[NH₃]²</text><path d="M100,145L335,145" fill="none" stroke="#213e36" stroke-width="3"/><text x="215" y="185" font-size="29" fill="#213e36" text-anchor="middle">[N₂][H₂]³</text><text x="15" y="152" font-size="26" fill="#213e36" text-anchor="start">K =</text><text x="20" y="260" font-size="21" fill="#213e36" text-anchor="start">Coefficients become exponents.</text><text x="20" y="289" font-size="21" fill="#213e36" text-anchor="start">Omit pure solids and pure liquids.</text></g><g transform="translate(35 573)"><path d="M40,130L405,130" fill="none" stroke="#213e36" stroke-width="3"/><circle cx="75" cy="130" r="24" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="75" y="136" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">Q</text><circle cx="220" cy="130" r="24" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="220" y="136" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">K</text><circle cx="370" cy="130" r="24" fill="#fbe0d4" stroke="#b54f2c" stroke-width="2"/><text x="370" y="136" font-size="17" fill="#b54f2c" text-anchor="middle" font-weight="700">Q</text><path d="M95,185L183.0,185.0" fill="none" stroke="#315c88" stroke-width="3"/><polygon points="195,185 183.0,191.0 183.0,179.0" fill="#315c88"/><path d="M350,185L262.0,185.0" fill="none" stroke="#b54f2c" stroke-width="3"/><polygon points="250,185 262.0,179.0 262.0,191.0" fill="#b54f2c"/><text x="45" y="230" font-size="19" fill="#315c88" text-anchor="start">Q &lt; K: right</text><text x="255" y="230" font-size="19" fill="#b54f2c" text-anchor="start">Q &gt; K: left</text><text x="20" y="300" font-size="18" fill="#213e36" text-anchor="start">Q = K: equilibrium</text><text x="20" y="329" font-size="18" fill="#213e36" text-anchor="start">Same expression; current vs equilibrium c.</text></g></g></svg>