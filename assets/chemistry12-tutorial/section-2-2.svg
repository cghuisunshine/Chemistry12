<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">2.2: Le Chatelier: partly oppose a stress; Separate the jump from the shift</title><desc id="desc">Adding reactant A shifts A to B. Its concentration–time graph jumps upward, then falls to a new plateau above the initial concentration.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§2.2 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Le Chatelier: partly oppose a stress</text><text x="528" y="88" font-size="18" font-weight="700">Separate the jump from the shift</text>
<g transform="translate(35 108)"><text x="20" y="40" font-size="30" fill="#213e36" text-anchor="start" font-weight="700">A ⇌ B</text><rect x="20" y="85" width="180" height="100" rx="9" fill="#eef2e9" stroke="#dce2d9" stroke-width="2"/><text x="110" y="125" font-size="24" fill="#213e36" text-anchor="middle">Add A</text><text x="110" y="157" font-size="17" fill="#213e36" text-anchor="middle">immediate stress</text><path d="M220,135L268.0,135.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="280,135 268.0,141.0 268.0,129.0" fill="#213e36"/><text x="295" y="130" font-size="21" fill="#213e36" text-anchor="start">Shift</text><text x="295" y="160" font-size="21" fill="#213e36" text-anchor="start">right</text><text x="20" y="260" font-size="19" fill="#213e36" text-anchor="start">Some added A is consumed.</text><text x="20" y="289" font-size="19" fill="#213e36" text-anchor="start">The original concentration is not restored.</text></g><g transform="translate(525 108)"><path d="M45,265L403.0,265.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="415,265 403.0,271.0 403.0,259.0" fill="#213e36"/><path d="M45,265L45.0,47.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="45,35 51.0,47.0 39.0,47.0" fill="#213e36"/><text x="48" y="22" font-size="18" fill="#213e36" text-anchor="start">[A]</text><text x="415" y="295" font-size="18" fill="#213e36" text-anchor="end">Time</text><path d="M45 175H170 V70 C195 70 230 125 290 125 H410" fill="none" stroke="#235b47" stroke-width="4"/><path d="M170,40L170,265" fill="none" stroke="#b54f2c" stroke-width="2" stroke-dasharray="6 5"/><text x="181" y="55" font-size="19" fill="#b54f2c" text-anchor="start">Add A</text><text x="275" y="112" font-size="17" fill="#213e36" text-anchor="start">New equilibrium</text><path d="M45,175L410,175" fill="none" stroke="#213e36" stroke-width="2" stroke-dasharray="6 5"/><text x="30" y="332" font-size="19" fill="#213e36" text-anchor="start">Jump first; chemical adjustment follows.</text></g></g></svg>