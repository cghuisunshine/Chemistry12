<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">4.5: Ionization: x relative to starting C; The square-root shortcut needs a check</title><desc id="desc">A weak-acid ICE relation gives remaining HA as C minus x and each ion as x. Ka equals x squared over C minus x, approximated by x squared over C only if x is small.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§4.5 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Ionization: x relative to starting C</text><text x="38" y="553" font-size="18" font-weight="700">The square-root shortcut needs a check</text>
<g transform="translate(35 108)"><text x="15" y="35" font-size="25" fill="#213e36" text-anchor="start" font-weight="700">HA + H₂O ⇌ A⁻ + H₃O⁺</text><text x="15" y="90" font-size="22" fill="#213e36" text-anchor="start"></text><text x="140" y="90" font-size="22" fill="#213e36" text-anchor="start">HA</text><text x="245" y="90" font-size="22" fill="#213e36" text-anchor="start">A⁻</text><text x="335" y="90" font-size="22" fill="#213e36" text-anchor="start">H₃O⁺</text><path d="M15,110L425,110" fill="none" stroke="#dce2d9" stroke-width="2"/><text x="25" y="142" font-size="22" fill="#213e36" text-anchor="start">I</text><text x="140" y="142" font-size="22" fill="#213e36" text-anchor="start">C</text><text x="245" y="142" font-size="22" fill="#213e36" text-anchor="start">0</text><text x="355" y="142" font-size="22" fill="#213e36" text-anchor="start">≈0</text><path d="M15,170L425,170" fill="none" stroke="#dce2d9" stroke-width="2"/><text x="25" y="202" font-size="22" fill="#213e36" text-anchor="start">C</text><text x="140" y="202" font-size="22" fill="#213e36" text-anchor="start">−x</text><text x="245" y="202" font-size="22" fill="#213e36" text-anchor="start">+x</text><text x="355" y="202" font-size="22" fill="#213e36" text-anchor="start">+x</text><path d="M15,230L425,230" fill="none" stroke="#dce2d9" stroke-width="2"/><text x="25" y="262" font-size="22" fill="#213e36" text-anchor="start">E</text><text x="140" y="262" font-size="22" fill="#213e36" text-anchor="start">C−x</text><text x="245" y="262" font-size="22" fill="#213e36" text-anchor="start">x</text><text x="355" y="262" font-size="22" fill="#213e36" text-anchor="start">x</text><text x="20" y="330" font-size="23" fill="#213e36" text-anchor="start">Percent ionization = 100x / C</text></g><g transform="translate(35 573)"><text x="20" y="60" font-size="30" fill="#213e36" text-anchor="start" font-weight="700">Ka = x² / (C − x)</text><path d="M215,90L215.0,138.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="215,150 209.0,138.0 221.0,138.0" fill="#213e36"/><text x="20" y="200" font-size="27" fill="#213e36" text-anchor="start">If x ≪ C:  x ≈ √(KaC)</text><text x="20" y="275" font-size="20" fill="#213e36" text-anchor="start">Check x/C ≤ 0.05 (5% guideline).</text><text x="20" y="304" font-size="20" fill="#213e36" text-anchor="start">If it fails, solve the full equation.</text></g></g></svg>