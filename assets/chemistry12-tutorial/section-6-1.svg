<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">6.1: Oxidation loses; reduction gains; The agent causes its partner’s change</title><desc id="desc">Zinc loses two electrons to become zinc 2 plus; copper 2 plus gains two electrons to become copper metal. Zinc is the reducing agent and copper ion is the oxidizing agent.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§6.1 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Oxidation loses; reduction gains</text><text x="528" y="88" font-size="18" font-weight="700">The agent causes its partner’s change</text>
<g transform="translate(35 108)"><text x="20" y="45" font-size="28" fill="#213e36" text-anchor="start" font-weight="700">Zn → Zn²⁺ + 2e⁻</text><text x="20" y="95" font-size="23" fill="#b54f2c" text-anchor="start">Oxidation: electrons lost</text><text x="20" y="185" font-size="28" fill="#213e36" text-anchor="start" font-weight="700">Cu²⁺ + 2e⁻ → Cu</text><text x="20" y="235" font-size="23" fill="#315c88" text-anchor="start">Reduction: electrons gained</text><text x="20" y="330" font-size="22" fill="#213e36" text-anchor="start">Electron loss = electron gain.</text></g><g transform="translate(525 108)"><circle cx="80" cy="150" r="36" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="80" y="156" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">Zn</text><circle cx="350" cy="150" r="39" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="350" y="156" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">Cu²⁺</text><path d="M135,150L278.0,150.0" fill="none" stroke="#b54f2c" stroke-width="3"/><polygon points="290,150 278.0,156.0 278.0,144.0" fill="#b54f2c"/><text x="215" y="125" font-size="26" fill="#b54f2c" text-anchor="middle">2e⁻</text><text x="80" y="235" font-size="22" fill="#213e36" text-anchor="middle">Reducing</text><text x="80" y="267" font-size="22" fill="#213e36" text-anchor="middle">agent</text><text x="350" y="235" font-size="22" fill="#213e36" text-anchor="middle">Oxidizing</text><text x="350" y="267" font-size="22" fill="#213e36" text-anchor="middle">agent</text><text x="20" y="330" font-size="19" fill="#213e36" text-anchor="start">The reducing agent is itself oxidized.</text></g></g></svg>