<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">5.2: Buffer: a weak acid and its partner; Each partner removes an added reagent</title><desc id="desc">A buffer contains a weak acid HA and conjugate base A minus. A minus consumes added hydronium, while HA consumes added hydroxide; their ratio affects pH and total amounts affect capacity.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§5.2 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Buffer: a weak acid and its partner</text><text x="528" y="88" font-size="18" font-weight="700">Each partner removes an added reagent</text>
<g transform="translate(35 108)"><circle cx="100" cy="135" r="47" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="100" y="141" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">HA</text><circle cx="330" cy="135" r="47" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="330" y="141" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">A⁻</text><text x="100" y="230" font-size="23" fill="#213e36" text-anchor="middle">Weak acid</text><text x="330" y="230" font-size="22" fill="#213e36" text-anchor="middle">Conjugate base</text><text x="20" y="295" font-size="20" fill="#213e36" text-anchor="start">Both in appreciable amounts.</text><text x="20" y="324" font-size="20" fill="#213e36" text-anchor="start">Together they resist small pH changes.</text></g><g transform="translate(525 108)"><text x="20" y="45" font-size="21" fill="#213e36" text-anchor="start">Added acid: A⁻ + H₃O⁺ → HA + H₂O</text><text x="20" y="110" font-size="21" fill="#213e36" text-anchor="start">Added base: HA + OH⁻ → A⁻ + H₂O</text><path d="M20,150L415,150" fill="none" stroke="#dce2d9" stroke-width="2"/><text x="20" y="205" font-size="21" fill="#213e36" text-anchor="start">Ratio [A⁻]/[HA] → mainly sets pH</text><text x="20" y="260" font-size="21" fill="#213e36" text-anchor="start">Total amounts → buffer capacity</text><text x="20" y="330" font-size="20" fill="#213e36" text-anchor="start">Neutralize the addition before using Ka.</text></g></g></svg>