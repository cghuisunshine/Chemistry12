<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">3.4: Mixing dilutes each ion; Compare the trial ion product to Ksp</title><desc id="desc">Separate silver and chloride solutions are mixed. Their diluted concentrations form Qsp, which is compared with Ksp for unsaturation, equilibrium threshold or precipitation.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§3.4 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Mixing dilutes each ion</text><text x="528" y="88" font-size="18" font-weight="700">Compare the trial ion product to Ksp</text>
<g transform="translate(35 108)"><path d="M25,55v130h150v-130" fill="none" stroke="#213e36" stroke-width="3"/><rect x="29" y="90" width="142" height="91" rx="9" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="2"/><path d="M260,55v130h150v-130" fill="none" stroke="#213e36" stroke-width="3"/><rect x="264" y="90" width="142" height="91" rx="9" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="2"/><text x="100" y="110" font-size="27" fill="#213e36" text-anchor="middle">Ag⁺</text><text x="335" y="110" font-size="27" fill="#213e36" text-anchor="middle">Cl⁻</text><text x="100" y="220" font-size="24" fill="#213e36" text-anchor="middle">c₁, V₁</text><text x="335" y="220" font-size="24" fill="#213e36" text-anchor="middle">c₂, V₂</text><text x="20" y="285" font-size="21" fill="#213e36" text-anchor="start">After mixing, before reaction:</text><text x="20" y="314" font-size="21" fill="#213e36" text-anchor="start">[Ag⁺] = c₁V₁ / (V₁ + V₂)</text></g><g transform="translate(525 108)"><text x="20" y="45" font-size="28" fill="#213e36" text-anchor="start" font-weight="700">Qsp = [Ag⁺][Cl⁻]</text><text x="20" y="115" font-size="23" fill="#315c88" text-anchor="start">Qsp &lt; Ksp → unsaturated</text><text x="20" y="185" font-size="23" fill="#235b47" text-anchor="start">Qsp = Ksp → threshold</text><text x="20" y="255" font-size="23" fill="#b54f2c" text-anchor="start">Qsp &gt; Ksp → precipitation</text><text x="20" y="330" font-size="18" fill="#213e36" text-anchor="start">Use mixed concentrations, not stock values.</text></g></g></svg>