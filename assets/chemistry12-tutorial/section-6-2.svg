<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">6.2: Balance electron loss and gain; Balance atoms and charge in the medium</title><desc id="desc">Zinc oxidation produces two electrons; two silver-ion reductions consume them, giving a balanced overall reaction. An acidic balancing guide uses water, hydrogen ions and electrons, then hydroxide for conversion to basic medium.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§6.2 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Balance electron loss and gain</text><text x="528" y="88" font-size="18" font-weight="700">Balance atoms and charge in the medium</text>
<g transform="translate(35 108)"><text x="20" y="45" font-size="25" fill="#213e36" text-anchor="start">Oxidation:</text><text x="20" y="103" font-size="25" fill="#213e36" text-anchor="start">Zn → Zn²⁺ + 2e⁻</text><text x="20" y="161" font-size="25" fill="#213e36" text-anchor="start">Reduction (×2):</text><text x="20" y="219" font-size="25" fill="#213e36" text-anchor="start">2Ag⁺ + 2e⁻ → 2Ag</text><path d="M15,265L425,265" fill="none" stroke="#dce2d9" stroke-width="2"/><text x="20" y="315" font-size="25" fill="#213e36" text-anchor="start" font-weight="700">Zn + 2Ag⁺ → Zn²⁺ + 2Ag</text></g><g transform="translate(525 108)"><text x="20" y="40" font-size="24" fill="#213e36" text-anchor="start" font-weight="700">In acidic solution</text><text x="20" y="95" font-size="23" fill="#213e36" text-anchor="start">O atoms → add H₂O</text><text x="20" y="143" font-size="23" fill="#213e36" text-anchor="start">H atoms → add H⁺</text><text x="20" y="191" font-size="23" fill="#213e36" text-anchor="start">Charge → add e⁻</text><text x="20" y="260" font-size="24" fill="#213e36" text-anchor="start" font-weight="700">For basic solution</text><text x="20" y="305" font-size="20" fill="#213e36" text-anchor="start">Add OH⁻ to remove H⁺ as H₂O;</text><text x="20" y="334" font-size="20" fill="#213e36" text-anchor="start">cancel excess H₂O and check charge.</text></g></g></svg>