<title id="title">4.2: Strong versus weak at the same C; Strength and concentration are distinct</title><desc id="desc">Equal acid-unit counts show complete ionization for a strong acid and partial ionization for a weak acid. Labels distinguish strength from concentration and relate larger Ka to stronger acid.</desc>
