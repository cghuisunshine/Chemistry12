rent ionization.</text></g><g transform="translate(525 108)"><text x="20" y="55" font-size="22" fill="#213e36" text-anchor="start">Strength: tendency to ionize</text><text x="20" y="110" font-size="22" fill="#213e36" text-anchor="start">Concentration: amount per volume</text><rect x="20" y="170" width="395" height="65" rx="9" fill="#eef2e9" stroke="#dce2d9" stroke-width="2"/><text x="218" y="211" font-size="23" fill="#213e36" text-anchor="middle">Larger Ka → stronger acid</text><text x="20" y="285" font-size="18" fill="#213e36" text-anchor="start">Stronger acid → weaker conjugate base.</text><text x="20" y="314" font-size="18" fill="#213e36" text-anchor="start">Particle counts are illustrative, not exact.</text></g></g></svg>