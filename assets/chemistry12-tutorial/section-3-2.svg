<title id="title">3.2: Precipitation: evidence, then inference; Separate before the next ion test</title><desc id="desc">A reagent is added to an unknown solution and a solid appears. A separation sequence shows selective reagent addition, filtration, then testing the remaining filtrate.</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§3.2 · Definitions &amp; theory · Schematic teaching model</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="510" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Precipitation: evidence, then inference</text><text x="528" y="88" font-size="18" font-weight="700">Separate before the next ion test</text>
<g transform="translate(35 108)"><path d="M90,65v170h250v-170" fill="none" stroke="#213e36" stroke-width="3"/><rect x="94" y="100" width="242" height="131" rx="9" fill="#f0f6fc" stroke="#f0f6fc" stroke-width="2"/><text x="215" y="35" font-size="22" fill="#213e36" text-anchor="middle">Unknown solution + reagent</text><path d="M220,45L220.0,93.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="220,105 214.0,93.0 226.0,93.0" fill="#213e36"/><rect x="125" y="200" width="180" height="28" rx="9" fill="#e8ddd0" stroke="#b54f2c" stroke-width="2"/><text x="215" y="278" font-size="21" fill="#213e36" text-anchor="middle">Observation: solid appears</text><text x="20" y="330" font-size="19" fill="#213e36" text-anchor="start">Inference: a low-solubility salt formed.</text></g><g transform="translate(525 108)"><rect x="20" y="45" width="395" height="65" rx="9" fill="#eef2e9" stroke="#dce2d9" stroke-width="2"/><text x="217" y="86" font-size="23" fill="#213e36" text-anchor="middle">Add selective reagent</text><path d="M215,120L215.0,138.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="215,150 209.0,138.0 221.0,138.0" fill="#213e36"/><text x="215" y="185" font-size="23" fill="#213e36" text-anchor="middle">Filter the precipitate</text><path d="M215,205L215.0,223.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="215,235 209.0,223.0 221.0,223.0" fill="#213e36"/><text x="35" y="275" font-size="20" fill="#213e36" text-anchor="start">Test filtrate for remaining ions.</text><text x="35" y="304" font-size="20" fill="#213e36" text-anchor="start">Use confirmatory tests when needed.</text></g></g></svg>