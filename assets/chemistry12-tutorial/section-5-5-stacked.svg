<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">5.5: Basic anhydride: a metal-oxide example; Acidic anhydride: a non-metal example</title><desc id="desc">Sodium oxide reacts with water to form sodium hydroxide and a basic solution. Sulfur trioxide forms sulfuric acid, which ionizes to give an acidic solution.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§5.5 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Basic anhydride: a metal-oxide example</text><text x="38" y="553" font-size="18" font-weight="700">Acidic anhydride: a non-metal example</text>
<g transform="translate(35 108)"><text x="20" y="45" font-size="25" fill="#213e36" text-anchor="start" font-weight="700">Reactive metal oxide</text><text x="20" y="110" font-size="26" fill="#213e36" text-anchor="start">Na₂O + H₂O → 2NaOH</text><circle cx="215" cy="210" r="42" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="215" y="216" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">OH⁻</text><text x="215" y="300" font-size="25" fill="#315c88" text-anchor="middle">Basic solution</text></g><g transform="translate(35 573)"><text x="20" y="45" font-size="23" fill="#213e36" text-anchor="start" font-weight="700">Acid-forming non-metal oxide</text><text x="20" y="110" font-size="26" fill="#213e36" text-anchor="start">SO₃ + H₂O → H₂SO₄</text><circle cx="215" cy="210" r="42" fill="#fbe0d4" stroke="#b54f2c" stroke-width="2"/><text x="215" y="216" font-size="17" fill="#b54f2c" text-anchor="middle" font-weight="700">H₃O⁺</text><text x="215" y="300" font-size="25" fill="#b54f2c" text-anchor="middle">Acidic solution</text><text x="20" y="340" font-size="20" fill="#213e36" text-anchor="start">H₂SO₄ ionizes in water.</text></g></g></svg>