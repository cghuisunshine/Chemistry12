<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">1.5: Mechanism: steps sum to the reaction; Slow elementary step and rate law</title><desc id="desc">Two steps A plus B to I and I plus B to P sum to A plus 2B to P. The slow first elementary step predicts a rate proportional to A and B, despite the overall coefficient 2 for B.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§1.5 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Mechanism: steps sum to the reaction</text><text x="38" y="553" font-size="18" font-weight="700">Slow elementary step and rate law</text>
<g transform="translate(35 108)"><text x="20" y="55" font-size="25" fill="#213e36" text-anchor="start">A + B → I     slow</text><text x="20" y="122" font-size="25" fill="#213e36" text-anchor="start">I + B → P     fast</text><path d="M15,151L420,151" fill="none" stroke="#213e36" stroke-width="3"/><text x="20" y="196" font-size="27" fill="#213e36" text-anchor="start" font-weight="700">A + 2B → P</text><text x="20" y="260" font-size="18" fill="#213e36" text-anchor="start">I is formed, then consumed: intermediate.</text><text x="20" y="289" font-size="18" fill="#213e36" text-anchor="start">A catalyst is consumed, then regenerated.</text></g><g transform="translate(35 573)"><text x="20" y="45" font-size="22" fill="#213e36" text-anchor="start">Slow elementary step: A + B → I</text><rect x="20" y="75" width="395" height="85" rx="9" fill="#eef2e9" stroke="#dce2d9" stroke-width="2"/><text x="215" y="126" font-size="29" fill="#213e36" text-anchor="middle" font-weight="700">rate ≈ k[A][B]</text><text x="20" y="220" font-size="21" fill="#213e36" text-anchor="start">Overall B coefficient = 2</text><text x="20" y="263" font-size="21" fill="#213e36" text-anchor="start">B order in this mechanism = 1</text><text x="20" y="306" font-size="21" fill="#213e36" text-anchor="start">Measure the overall rate law.</text></g></g></svg>