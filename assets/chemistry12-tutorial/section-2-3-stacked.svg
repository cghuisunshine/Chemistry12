<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">2.3: Volume: count gaseous coefficients; Temperature: identify the heat side</title><desc id="desc">For nitrogen plus three hydrogen to two ammonia, compression favours the two-gas-particle product side. Heating an exothermic equilibrium shifts left and cooling shifts right.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§2.3 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Volume: count gaseous coefficients</text><text x="38" y="553" font-size="18" font-weight="700">Temperature: identify the heat side</text>
<g transform="translate(35 108)"><text x="20" y="42" font-size="23" fill="#213e36" text-anchor="start" font-weight="700">N₂(g) + 3H₂(g) ⇌ 2NH₃(g)</text><rect x="25" y="90" width="170" height="135" rx="9" fill="#fff" stroke="#dce2d9" stroke-width="2"/><rect x="280" y="90" width="100" height="135" rx="9" fill="#fff" stroke="#dce2d9" stroke-width="2"/><path d="M210,155L253.0,155.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="265,155 253.0,161.0 253.0,149.0" fill="#213e36"/><text x="110" y="165" font-size="27" fill="#213e36" text-anchor="middle">V</text><text x="330" y="165" font-size="27" fill="#213e36" text-anchor="middle">V/2</text><text x="110" y="265" font-size="22" fill="#213e36" text-anchor="middle">Compress</text><text x="330" y="265" font-size="22" fill="#213e36" text-anchor="middle">Shift right</text><text x="20" y="320" font-size="18" fill="#213e36" text-anchor="start">4 gas particles → 2: partial pressure relief.</text></g><g transform="translate(35 573)"><text x="20" y="42" font-size="22" fill="#213e36" text-anchor="start" font-weight="700">Exothermic forward reaction</text><text x="20" y="100" font-size="23" fill="#213e36" text-anchor="start">Reactants ⇌ Products + heat</text><path d="M310,150L137.0,150.0" fill="none" stroke="#b54f2c" stroke-width="3"/><polygon points="125,150 137.0,144.0 137.0,156.0" fill="#b54f2c"/><text x="220" y="190" font-size="22" fill="#b54f2c" text-anchor="middle">Heat → shift left</text><path d="M125,245L298.0,245.0" fill="none" stroke="#235b47" stroke-width="3"/><polygon points="310,245 298.0,251.0 298.0,239.0" fill="#235b47"/><text x="220" y="285" font-size="22" fill="#235b47" text-anchor="middle">Cool → shift right</text><text x="20" y="335" font-size="20" fill="#213e36" text-anchor="start">Temperature changes K.</text></g></g></svg>