<title id="title">6.4: Galvanic cell: spontaneous electricity; Electrons in wire; ions in electrolyte</title><desc id="desc">Two half-cells are connected by an external wire and salt bridge. Electrons flow from zinc anode to copper cathode. Anions migrate toward the anode and cations toward the cathode.</desc>
