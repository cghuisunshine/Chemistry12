<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">4.1: Brønsted–Lowry: track the proton; Conjugate pairs differ by one H⁺</title><desc id="desc">HA gives a proton to water, forming A minus and hydronium. The conjugate pairs HA/A minus and water/hydronium differ by exactly one proton and one charge unit.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§4.1 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Brønsted–Lowry: track the proton</text><text x="38" y="553" font-size="18" font-weight="700">Conjugate pairs differ by one H⁺</text>
<g transform="translate(35 108)"><text x="20" y="50" font-size="27" fill="#213e36" text-anchor="start" font-weight="700">HA + H₂O ⇌ A⁻ + H₃O⁺</text><path d="M65,95L318.0,95.0" fill="none" stroke="#b54f2c" stroke-width="3"/><polygon points="330,95 318.0,101.0 318.0,89.0" fill="#b54f2c"/><text x="200" y="135" font-size="23" fill="#b54f2c" text-anchor="middle">H⁺ transfer</text><text x="20" y="210" font-size="23" fill="#213e36" text-anchor="start">HA: donor → acid</text><text x="20" y="265" font-size="23" fill="#213e36" text-anchor="start">H₂O: acceptor → base</text><text x="20" y="330" font-size="19" fill="#213e36" text-anchor="start">Water’s role depends on its partner.</text></g><g transform="translate(35 573)"><text x="20" y="50" font-size="30" fill="#213e36" text-anchor="start" font-weight="700">HA / A⁻</text><text x="20" y="95" font-size="30" fill="#213e36" text-anchor="start" font-weight="700">H₂O / H₃O⁺</text><text x="20" y="165" font-size="20" fill="#213e36" text-anchor="start">Each conjugate pair differs by one H⁺.</text><text x="20" y="208" font-size="20" fill="#213e36" text-anchor="start">Losing H⁺ lowers the charge by 1.</text><text x="20" y="251" font-size="20" fill="#213e36" text-anchor="start">Gaining H⁺ raises the charge by 1.</text><text x="20" y="330" font-size="19" fill="#213e36" text-anchor="start">Example: NH₄⁺ / NH₃ is a conjugate pair.</text></g></g></svg>