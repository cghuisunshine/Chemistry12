<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">2.6: ICE: initial, change, equilibrium; Solve and check the equilibrium</title><desc id="desc">An ICE table for H2 plus I2 to 2HI has changes minus x, minus x and plus 2x. The resulting expression is K equals 4x squared divided by 1 minus x squared.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§2.6 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">ICE: initial, change, equilibrium</text><text x="38" y="553" font-size="18" font-weight="700">Solve and check the equilibrium</text>
<g transform="translate(35 108)"><text x="15" y="35" font-size="27" fill="#213e36" text-anchor="start" font-weight="700">H₂ + I₂ ⇌ 2HI</text><text x="25" y="90" font-size="22" fill="#213e36" text-anchor="start"></text><text x="140" y="90" font-size="22" fill="#213e36" text-anchor="start">H₂</text><text x="245" y="90" font-size="22" fill="#213e36" text-anchor="start">I₂</text><text x="355" y="90" font-size="22" fill="#213e36" text-anchor="start">HI</text><path d="M15,110L425,110" fill="none" stroke="#dce2d9" stroke-width="2"/><text x="25" y="142" font-size="22" fill="#213e36" text-anchor="start">I</text><text x="140" y="142" font-size="22" fill="#213e36" text-anchor="start">1.0</text><text x="245" y="142" font-size="22" fill="#213e36" text-anchor="start">1.0</text><text x="355" y="142" font-size="22" fill="#213e36" text-anchor="start">0</text><path d="M15,170L425,170" fill="none" stroke="#dce2d9" stroke-width="2"/><text x="25" y="202" font-size="22" fill="#213e36" text-anchor="start">C</text><text x="140" y="202" font-size="22" fill="#213e36" text-anchor="start">−x</text><text x="245" y="202" font-size="22" fill="#213e36" text-anchor="start">−x</text><text x="355" y="202" font-size="22" fill="#213e36" text-anchor="start">+2x</text><path d="M15,230L425,230" fill="none" stroke="#dce2d9" stroke-width="2"/><text x="25" y="262" font-size="22" fill="#213e36" text-anchor="start">E</text><text x="140" y="262" font-size="22" fill="#213e36" text-anchor="start">1−x</text><text x="245" y="262" font-size="22" fill="#213e36" text-anchor="start">1−x</text><text x="355" y="262" font-size="22" fill="#213e36" text-anchor="start">2x</text><text x="20" y="330" font-size="18" fill="#213e36" text-anchor="start">Molar concentrations; change follows ratios.</text></g><g transform="translate(35 573)"><text x="20" y="60" font-size="25" fill="#213e36" text-anchor="start" font-weight="700">Substitute E into K</text><text x="20" y="125" font-size="26" fill="#213e36" text-anchor="start">K = (2x)² / (1 − x)²</text><path d="M220,155L220.0,193.0" fill="none" stroke="#213e36" stroke-width="3"/><polygon points="220,205 214.0,193.0 226.0,193.0" fill="#213e36"/><text x="20" y="245" font-size="21" fill="#213e36" text-anchor="start">Solve → reject impossible roots</text><text x="20" y="287" font-size="21" fill="#213e36" text-anchor="start">Check: concentrations ≥ 0</text><text x="20" y="329" font-size="21" fill="#213e36" text-anchor="start">Substitute back into K.</text></g></g></svg>