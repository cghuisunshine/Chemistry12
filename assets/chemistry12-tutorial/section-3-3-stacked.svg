<svg xmlns="http://www.w3.org/2000/svg" width="500" height="960" viewBox="0 0 500 960" role="img" aria-labelledby="title desc">
<title id="title">3.3: Molar solubility and ion ratios; Build Ksp from the balanced equation</title><desc id="desc">One dissolved PbCl2 formula unit gives one lead ion and two chloride ions. Molar solubility s leads to Ksp equals s times 2s squared, or 4s cubed.</desc>
<rect width="500" height="960" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#213e36">
<text x="30" y="34" font-size="18" fill="#235b47">§3.3 · Definitions &amp; theory · Schematic</text>
<rect x="20" y="55" width="470" height="420" rx="12" fill="#f7f9f4"/><rect x="20" y="520" width="470" height="420" rx="12" fill="#f7f9f4"/>
<text x="38" y="88" font-size="18" font-weight="700">Molar solubility and ion ratios</text><text x="38" y="553" font-size="18" font-weight="700">Build Ksp from the balanced equation</text>
<g transform="translate(35 108)"><text x="15" y="40" font-size="22" fill="#213e36" text-anchor="start" font-weight="700">PbCl₂(s) ⇌ Pb²⁺(aq) + 2Cl⁻(aq)</text><circle cx="90" cy="130" r="34" fill="#dfedb0" stroke="#235b47" stroke-width="2"/><text x="90" y="136" font-size="17" fill="#235b47" text-anchor="middle" font-weight="700">Pb²⁺</text><circle cx="260" cy="105" r="29" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="260" y="111" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">Cl⁻</text><circle cx="350" cy="175" r="29" fill="#dbe9fa" stroke="#315c88" stroke-width="2"/><text x="350" y="181" font-size="17" fill="#315c88" text-anchor="middle" font-weight="700">Cl⁻</text><text x="90" y="210" font-size="28" fill="#213e36" text-anchor="middle">s</text><text x="305" y="240" font-size="26" fill="#213e36" text-anchor="middle">2s total</text><text x="20" y="320" font-size="20" fill="#213e36" text-anchor="start">Pure water: [Pb²⁺] = s; [Cl⁻] = 2s.</text></g><g transform="translate(35 573)"><text x="20" y="60" font-size="28" fill="#213e36" text-anchor="start" font-weight="700">Ksp = [Pb²⁺][Cl⁻]²</text><text x="20" y="120" font-size="28" fill="#213e36" text-anchor="start">= s(2s)² = 4s³</text><rect x="20" y="170" width="395" height="75" rx="9" fill="#eef2e9" stroke="#dce2d9" stroke-width="2"/><text x="215" y="217" font-size="27" fill="#213e36" text-anchor="middle">s = (Ksp / 4)⅓</text><text x="20" y="295" font-size="19" fill="#213e36" text-anchor="start">Solid omitted; temperature fixed.</text><text x="20" y="324" font-size="19" fill="#213e36" text-anchor="start">A common ion changes the s relationship.</text></g></g></svg>