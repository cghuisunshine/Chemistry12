<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">Productive Cl–Cl approach and products</title><desc id="desc">In the corrected orientation the chlorine attached to nitrogen faces the incoming chlorine atom. A new chlorine–chlorine bond forms while the nitrogen–chlorine bond breaks, leaving nitrogen dioxide and chlorine gas.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#183832"/></marker></defs>
<rect width="1000" height="670" rx="16" fill="#ffffff"/>
<g font-family="sans-serif" fill="#183832"><text x="36" y="44" font-size="27" font-weight="700">Corrected orientation</text><text x="36" y="80" font-size="22" >Aim the incoming Cl atom at the chlorine end of ClNO₂.</text><path d="M250 205L375 205" fill="none" stroke="#183832" stroke-width="5"/><path d="M250 205L155 135" fill="none" stroke="#183832" stroke-width="5"/><path d="M250 205L155 275" fill="none" stroke="#183832" stroke-width="5"/><circle cx="250" cy="205" r="30" fill="#dbe9fa" stroke="#315c88" stroke-width="2.5"/><text x="250" y="213" text-anchor="middle" font-size="24" font-weight="700">N</text><circle cx="375" cy="205" r="30" fill="#e0edb5" stroke="#486b27" stroke-width="2.5"/><text x="375" y="213" text-anchor="middle" font-size="24" font-weight="700">Cl</text><circle cx="155" cy="135" r="30" fill="#fbe0d4" stroke="#9a4c34" stroke-width="2.5"/><text x="155" y="143" text-anchor="middle" font-size="24" font-weight="700">O</text><circle cx="155" cy="275" r="30" fill="#fbe0d4" stroke="#9a4c34" stroke-width="2.5"/><text x="155" y="283" text-anchor="middle" font-size="24" font-weight="700">O</text><circle cx="785" cy="205" r="30" fill="#e0edb5" stroke="#486b27" stroke-width="2.5"/><text x="785" y="213" text-anchor="middle" font-size="24" font-weight="700">Cl</text><path d="M445 205L517.0 205.0" stroke="#183832" stroke-width="4" fill="none"/><polygon points="535,205 517.0,215.0 517.0,195.0" fill="#183832"/><path d="M675 205L603.0 205.0" stroke="#183832" stroke-width="4" fill="none"/><polygon points="585,205 603.0,195.0 603.0,215.0" fill="#183832"/><text x="250" y="334" font-size="23" text-anchor="middle" font-weight="700">ClNO₂</text><text x="785" y="334" font-size="23" text-anchor="middle" font-weight="700">Cl atom</text><text x="500" y="378" font-size="22" text-anchor="middle">N–Cl breaks; a new Cl–Cl bond forms.</text><path d="M36 402H964" stroke="#dce2d9" stroke-width="2"/><text x="36" y="432" font-size="25" font-weight="700">Products</text><path d="M260 520L175 470" fill="none" stroke="#183832" stroke-width="5"/><path d="M260 520L175 570" fill="none" stroke="#183832" stroke-width="5"/><circle cx="260" cy="520" r="30" fill="#dbe9fa" stroke="#315c88" stroke-width="2.5"/><text x="260" y="528" text-anchor="middle" font-size="24" font-weight="700">N</text><circle cx="175" cy="470" r="30" fill="#fbe0d4" stroke="#9a4c34" stroke-width="2.5"/><text x="175" y="478" text-anchor="middle" font-size="24" font-weight="700">O</text><circle cx="175" cy="570" r="30" fill="#fbe0d4" stroke="#9a4c34" stroke-width="2.5"/><text x="175" y="578" text-anchor="middle" font-size="24" font-weight="700">O</text><text x="490" y="530" font-size="34" text-anchor="middle">+</text><path d="M685 520L785 520" fill="none" stroke="#183832" stroke-width="5"/><circle cx="685" cy="520" r="30" fill="#e0edb5" stroke="#486b27" stroke-width="2.5"/><text x="685" y="528" text-anchor="middle" font-size="24" font-weight="700">Cl</text><circle cx="785" cy="520" r="30" fill="#e0edb5" stroke="#486b27" stroke-width="2.5"/><text x="785" y="528" text-anchor="middle" font-size="24" font-weight="700">Cl</text><text x="240" y="620" font-size="24" text-anchor="middle" font-weight="700">NO₂</text><text x="735" y="620" font-size="24" text-anchor="middle" font-weight="700">Cl₂</text><text x="36" y="653" font-size="16" fill="#60736b">Connectivity sketch only. Labels identify the atoms; colours are supplementary.</text></g></svg>