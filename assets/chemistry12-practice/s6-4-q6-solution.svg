<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><title>Section 6.4 Q6: formal zinc / fluorine cell</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="1100" height="700" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="43" font-size="29" fill="#183832" text-anchor="start">Section 6.4 Q6: formal zinc / fluorine cell</text><rect x="70" y="250" width="370" height="280" rx="10" fill="#eff8fb" stroke="#183832" stroke-width="2"/><path d="M72,340 L438,340" fill="none" stroke="#176baf" stroke-width="2"/><text x="255" y="570" font-size="24" fill="#183832" text-anchor="middle">Zn anode (−)</text><text x="255" y="608" font-size="22" fill="#183832" text-anchor="middle">1.0 M ZnCl₂</text><rect x="660" y="250" width="370" height="280" rx="10" fill="#eff8fb" stroke="#183832" stroke-width="2"/><path d="M662,340 L1028,340" fill="none" stroke="#176baf" stroke-width="2"/><text x="845" y="570" font-size="24" fill="#183832" text-anchor="middle">Pt / F₂ cathode (+)</text><text x="845" y="608" font-size="22" fill="#183832" text-anchor="middle">1.0 M NaF</text><rect x="145" y="220" width="30" height="260" rx="10" fill="#c6cbd0" stroke="#183832" stroke-width="2"/><rect x="810" y="220" width="24" height="260" rx="10" fill="#c6cbd0" stroke="#183832" stroke-width="2"/><path d="M160,220 L160,130" fill="none" stroke="#183832" stroke-width="3"/><path d="M160,130 L822,130" fill="none" stroke="#183832" stroke-width="3" marker-end="url(#arrow)"/><path d="M822,130 L822,220" fill="none" stroke="#183832" stroke-width="3"/><text x="490" y="112" font-size="23" fill="#183832" text-anchor="middle">e⁻ through wire: Zn → Pt / F₂</text><path d="M390,390 L390,205 Q550,150 710,205 L710,390" fill="none" stroke="#b6cabe" stroke-width="20"/><text x="550" y="205" font-size="20" fill="#183832" text-anchor="middle">Salt bridge</text><path d="M530,242 L430,242" fill="none" stroke="#b85b14" stroke-width="2" marker-end="url(#arrow)"/><path d="M570,242 L675,242" fill="none" stroke="#176baf" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="275" font-size="18" fill="#b85b14" text-anchor="start">anions → Zn</text><text x="570" y="275" font-size="18" fill="#176baf" text-anchor="start">cations → F₂</text><text x="885" y="313" font-size="19" fill="#183832" text-anchor="start">F₂(g) inlet</text><path d="M895,320 L855,415" fill="none" stroke="#183832" stroke-width="2" marker-end="url(#arrow)"/><circle cx="850" cy="440" r="7" fill="none" stroke="#176baf" stroke-width="2"/><circle cx="865" cy="400" r="7" fill="none" stroke="#176baf" stroke-width="2"/><circle cx="845" cy="370" r="7" fill="none" stroke="#176baf" stroke-width="2"/><text x="255" y="495" font-size="20" fill="#b85b14" text-anchor="middle">Zn → Zn²⁺ + 2e⁻</text><text x="850" y="495" font-size="20" fill="#176baf" text-anchor="middle">F₂ + 2e⁻ → 2F⁻</text><text x="550" y="653" font-size="22" fill="#183832" text-anchor="middle">E° = 3.63 V. Formal model only: F₂ reacts with water.</text></g></svg>