<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc">
<title id="title">ClNO₂ and a chlorine atom: the given collision</title><desc id="desc">ClNO₂ is on the left with its chlorine pointing upper left. A separate Cl atom approaches from the right toward the oxygen side. Arrows show the particles moving toward each other.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#183832"/></marker></defs>
<rect width="1000" height="455" rx="16" fill="#ffffff"/>
<g font-family="sans-serif" fill="#183832"><text x="36" y="43" font-size="26" font-weight="700">7  Collision theory: ClNO₂ + Cl</text><text x="36" y="79" font-size="20" >With sufficient collision energy, is the orientation below likely to form Cl₂ and NO₂?</text><text x="36" y="109" font-size="20" >If not, redraw the particles so that a successful collision would be likely.</text><path d="M260 245L170 185" fill="none" stroke="#183832" stroke-width="5"/><path d="M260 245L335 185" fill="none" stroke="#183832" stroke-width="5"/><path d="M260 245L285 325" fill="none" stroke="#183832" stroke-width="5"/><circle cx="260" cy="245" r="30" fill="#dbe9fa" stroke="#315c88" stroke-width="2.5"/><text x="260" y="253" text-anchor="middle" font-size="24" font-weight="700">N</text><circle cx="170" cy="185" r="30" fill="#e0edb5" stroke="#486b27" stroke-width="2.5"/><text x="170" y="193" text-anchor="middle" font-size="24" font-weight="700">Cl</text><circle cx="335" cy="185" r="30" fill="#fbe0d4" stroke="#9a4c34" stroke-width="2.5"/><text x="335" y="193" text-anchor="middle" font-size="24" font-weight="700">O</text><circle cx="285" cy="325" r="30" fill="#fbe0d4" stroke="#9a4c34" stroke-width="2.5"/><text x="285" y="333" text-anchor="middle" font-size="24" font-weight="700">O</text><circle cx="785" cy="245" r="30" fill="#e0edb5" stroke="#486b27" stroke-width="2.5"/><text x="785" y="253" text-anchor="middle" font-size="24" font-weight="700">Cl</text><path d="M400 245L502.0 245.0" stroke="#183832" stroke-width="4" fill="none"/><polygon points="520,245 502.0,255.0 502.0,235.0" fill="#183832"/><path d="M680 245L578.0 245.0" stroke="#183832" stroke-width="4" fill="none"/><polygon points="560,245 578.0,235.0 578.0,255.0" fill="#183832"/><text x="240" y="382" font-size="23" text-anchor="middle" font-weight="700">ClNO₂</text><text x="785" y="382" font-size="23" text-anchor="middle" font-weight="700">Cl atom</text><text x="36" y="426" font-size="16" fill="#60736b">Redrawn from the original orientation. Connectivity sketch; not a Lewis structure or to scale.</text></g></svg>