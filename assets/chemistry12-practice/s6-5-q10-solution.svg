<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><title>Silver transfer onto an aluminium spoon</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="1100" height="700" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="44" font-size="29" fill="#183832" text-anchor="start">Silver transfer onto an aluminium spoon</text><rect x="425" y="70" width="250" height="75" rx="10" fill="#edf5ee" stroke="#183832" stroke-width="2"/><text x="550" y="101" font-size="24" fill="#183832" text-anchor="middle">DC source</text><text x="450" y="132" font-size="30" fill="#b85b14" text-anchor="start">+</text><text x="634" y="132" font-size="30" fill="#176baf" text-anchor="start">−</text><path d="M445,145 L445,185" fill="none" stroke="#183832" stroke-width="3"/><path d="M445,185 L260,185" fill="none" stroke="#183832" stroke-width="3"/><path d="M260,185 L260,290" fill="none" stroke="#183832" stroke-width="3"/><path d="M655,145 L655,185" fill="none" stroke="#183832" stroke-width="3"/><path d="M655,185 L840,185" fill="none" stroke="#183832" stroke-width="3"/><path d="M840,185 L840,290" fill="none" stroke="#183832" stroke-width="3"/><rect x="125" y="275" width="850" height="280" rx="10" fill="#eff8fb" stroke="#183832" stroke-width="2"/><path d="M128,350 L972,350" fill="none" stroke="#176baf" stroke-width="2"/><text x="260" y="242" font-size="23" fill="#b85b14" text-anchor="middle">ANODE (+)</text><text x="840" y="242" font-size="23" fill="#176baf" text-anchor="middle">CATHODE (−)</text><rect x="245" y="290" width="30" height="200" rx="10" fill="#d3d7dc" stroke="#183832" stroke-width="2"/><rect x="830" y="290" width="18" height="110" rx="10" fill="#c4cbd4" stroke="#183832" stroke-width="2"/><ellipse cx="839" cy="444" rx="42" ry="59" fill="#d8e1ed" stroke="#176baf" stroke-width="5"/><text x="170" y="327" font-size="20" fill="#183832" text-anchor="start">Ag strip</text><text x="880" y="327" font-size="20" fill="#183832" text-anchor="start">Al spoon</text><text x="550" y="398" font-size="24" fill="#183832" text-anchor="middle">Electrolyte containing Ag⁺</text><text x="550" y="435" font-size="20" fill="#183832" text-anchor="middle">(idealized AgNO₃ solution)</text><path d="M530,480 L760,480" fill="none" stroke="#176baf" stroke-width="3" marker-end="url(#arrow)"/><text x="620" y="465" font-size="21" fill="#176baf" text-anchor="middle">Ag⁺ →</text><path d="M550,520 L335,520" fill="none" stroke="#b85b14" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="508" font-size="21" fill="#b85b14" text-anchor="middle">← NO₃⁻</text><text x="260" y="593" font-size="25" fill="#b85b14" text-anchor="middle">Ag → Ag⁺ + e⁻</text><text x="820" y="593" font-size="25" fill="#176baf" text-anchor="middle">Ag⁺ + e⁻ → Ag</text><text x="550" y="635" font-size="23" fill="#183832" text-anchor="middle">Ag anode loses mass; Ag coating on spoon grows.</text><text x="550" y="675" font-size="20" fill="#183832" text-anchor="middle">E° = 0 V for Ag transfer; applied voltage must cover real losses.</text></g></svg>