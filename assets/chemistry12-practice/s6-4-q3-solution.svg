<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><title>Section 6.4 Q3: bromine half-cell</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="1100" height="700" fill="#fff"/><g font-family="Arial, sans-serif"><text x="45" y="46" font-size="29" fill="#183832" text-anchor="start">Section 6.4 Q3: bromine half-cell</text><rect x="365" y="250" width="370" height="280" rx="10" fill="#eff8fb" stroke="#183832" stroke-width="2"/><path d="M367,340 L733,340" fill="none" stroke="#176baf" stroke-width="2"/><text x="550" y="570" font-size="24" fill="#183832" text-anchor="middle">Bromine / bromide half-cell</text><text x="550" y="608" font-size="22" fill="#183832" text-anchor="middle">1.0 M Br⁻ (standard schematic)</text><rect x="485" y="190" width="24" height="300" rx="10" fill="#c5cbd0" stroke="#183832" stroke-width="2"/><path d="M497,190 L497,100" fill="none" stroke="#183832" stroke-width="3"/><path d="M497,100 L855,100" fill="none" stroke="#183832" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="88" font-size="22" fill="#183832" text-anchor="start">Wire to other half-cell</text><text x="60" y="218" font-size="24" fill="#183832" text-anchor="start">Inert Pt conductor</text><path d="M285,215 L480,270" fill="none" stroke="#183832" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="478" width="363" height="49" rx="10" fill="#e4ad79" stroke="#183832" stroke-width="2"/><text x="390" y="511" font-size="20" fill="#183832" text-anchor="start">Br₂(l), contacting Br⁻ solution</text><text x="60" y="385" font-size="26" fill="#176baf" text-anchor="start">Br₂ + 2e⁻ ⇌ 2Br⁻</text><text x="60" y="430" font-size="24" fill="#176baf" text-anchor="start">E°red = +1.09 V</text><text x="550" y="666" font-size="21" fill="#183832" text-anchor="middle">Pt conducts electrons; it is not consumed. Electrode role depends on the partner.</text></g></svg>